version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1  # Production-grade PostgreSQL pre-bundled with pgvector
    container_name: opspilot-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: opspilot
      POSTGRES_HOST_AUTH_METHOD: trust  # Trust auth matching dev setup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: opspilot-redis
    restart: always
    ports:
      - "6379:6379"

  gateway-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-gateway
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres@postgres:5432/opspilot
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres@postgres:5432/opspilot
    depends_on:
      - postgres
      - redis

  frontend-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - gateway-api

volumes:
  pgdata:
